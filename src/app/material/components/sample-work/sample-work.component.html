<div class="container" style="background-color: white; padding: 5%">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" required />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" required />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-3">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>Date of Birth</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="dateOfBirth"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>Age</mat-label>
          <input matInput type="number" formControlName="age" required />
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-radio-group
          formControlName="gender"
          aria-label="Select a gender"
          style="width: 100%"
        >
          <mat-radio-button value="male">Male</mat-radio-button>
          <mat-radio-button value="female">Female</mat-radio-button>
          <mat-radio-button value="other">Other</mat-radio-button>
        </mat-radio-group>
      </div>
      <div class="col-md-3">
        <mat-checkbox style="width: 100%" formControlName="maritalStatus"
          >Married</mat-checkbox
        >
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" required />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>Zip</mat-label>
          <input matInput formControlName="zip" required />
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-form-field appearance="fill" style="width: 100%">
          <mat-label>State</mat-label>
          <mat-select formControlName="state">
            <mat-option
              *ngFor="let state of ['New York', 'California', 'Texas']"
              [value]="state"
            >
              {{ state }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-4"></div>
    </div>
    <button mat-raised-button color="primary" type="submit">Submit</button>
  </form>
</div>
